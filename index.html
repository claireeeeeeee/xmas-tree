<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16243a">
<title>圣诞盲盒树</title>
<meta name="description" content="今年的圣诞树，交给朋友们来装饰吧！">
<meta property="og:title" content="圣诞盲盒树">
<meta property="og:description" content="今年的圣诞树，交给朋友们来装饰吧！">
<meta property="og:image" content="art/share_card.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" as="image" href="art/tree.webp">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>

<header class="topbar">
  <a class="brand" href="./" id="brandLink">🎄 圣诞盲盒树</a>
  <button class="icon-btn" id="soundBtn" type="button" aria-label="音效开关" title="音效开关">🔔</button>
</header>

<main id="app">
  <!-- 首页 -->
  <section class="screen" id="screenHome" hidden>
    <div class="hero">
      <div class="hero-tree"><img id="heroTree" alt=""></div>
      <h1>今年的圣诞树，<br>交给朋友们来装饰吧！</h1>
      <p class="lead">创建一棵属于你的圣诞树，把链接发给朋友。<br>每位朋友拆一个圣诞盲盒，亲手挂上一件装饰。</p>
      <button class="btn primary big" id="goCreate" type="button">🎄 创建我的圣诞树</button>
    </div>
    <ol class="steps">
      <li><b>1</b><span>创建圣诞树，复制专属链接</span></li>
      <li><b>2</b><span>朋友打开链接，拆一个盲盒</span></li>
      <li><b>3</b><span>把装饰挂到你的树上</span></li>
    </ol>
    <div class="my-trees" id="myTrees" hidden>
      <h2>我的圣诞树</h2>
      <ul id="myTreesList"></ul>
    </div>
  </section>

  <!-- 创建 -->
  <section class="screen" id="screenCreate" hidden>
    <form class="card" id="createForm" autocomplete="off">
      <h1>🎄 认领你的圣诞树</h1>
      <p class="lead">告诉圣诞老人，这棵树属于谁？</p>
      <label class="field"><span>你的名字</span>
        <input id="ownerName" maxlength="20" placeholder="例如：小鱼" required></label>
      <p class="hint">不需要手机号、邮箱和密码。</p>
      <button class="btn primary big" type="submit" id="createBtn">创建我的圣诞树</button>
      <button class="btn ghost" type="button" data-go="home">返回</button>
    </form>
  </section>

  <!-- 圣诞树 -->
  <section class="screen" id="screenTree" hidden>
    <div class="tree-head">
      <h1 id="treeTitle"></h1>
      <p class="lead" id="treeSub"></p>
      <p class="stats" id="treeStats"></p>
    </div>
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <img class="tree-img" id="treeImg" alt="" draggable="false">
        <div class="ornament-layer" id="ornLayer"></div>
        <div class="drop-hint" id="dropHint" hidden></div>
      </div>
    </div>
    <div class="actions" id="treeActions"></div>
    <div class="tray" id="tray" hidden>
      <p id="trayText"></p>
      <div class="tray-row">
        <div class="tray-slot" id="traySlot"></div>
        <div class="tray-btns">
          <button class="btn primary" id="confirmPlace" type="button" disabled>挂上去！</button>
          <button class="btn ghost small" id="autoPlace" type="button">帮我找个空位</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 找不到树 -->
  <section class="screen" id="screenMissing" hidden>
    <div class="card center">
      <h1>🌨️ 找不到这棵圣诞树</h1>
      <p class="lead" id="missingText">链接可能已经失效，或者这棵树已经被主人删除了。</p>
      <button class="btn primary" type="button" data-go="create">我也要创建圣诞树</button>
    </div>
  </section>
</main>

<div class="modal-root" id="modalRoot" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js?v=3"></script>
<script src="ornaments.js?v=3"></script>
<script src="api.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
